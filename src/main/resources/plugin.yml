name: ProtectCore
version: '5.7'
main: com.lucidaps.ProtectCore
description: Logging, lookup, rollback, and web editor tools for server protection.
author: LucidAPS
website: https://www.spigotmc.org/resources/129705/
prefix: ProtectCore
api-version: '1.21'
softdepend:
  - WorldEdit
  - FastAsyncWorldEdit

commands:
  po:
    description: Main command for ProtectCore.
    usage: /po <lookup|near|inspect|i|editor|rollback|reload|purge|status> [parameters]
    permission: protectcore.commands
  pc_tp:
    description: Internal teleport command used by ProtectCore's clickable log coordinates.
    usage: /pc_tp <token> <dimension> <x> <y> <z>
    permission: protectcore.hidden.tp

permissions:
  protectcore.*:
    description: Grants all ProtectCore permissions.
    default: op
    children:
      protectcore.commands: true
      protectcore.lookup: true
      protectcore.rollback: true
      protectcore.rollback.bypass: true
      protectcore.near: true
      protectcore.reload: true
      protectcore.editor: true
      protectcore.inspect: true
      protectcore.admin.purge: true
      protectcore.admin.status: true
      protectcore.hidden.tp: true
  protectcore.commands:
    description: Allows access to the /po command.
    default: op
  protectcore.lookup:
    description: Allows lookup searches.
    default: op
  protectcore.rollback:
    description: Allows rollback commands.
    default: op
  protectcore.rollback.bypass:
    description: Allows bypassing rollback safety limits.
    default: op
  protectcore.near:
    description: Allows nearby log searches.
    default: op
  protectcore.reload:
    description: Allows reloading ProtectCore configuration.
    default: op
  protectcore.editor:
    description: Allows opening the embedded web editor.
    default: op
  protectcore.inspect:
    description: Allows toggling inspector mode.
    default: op
  protectcore.admin.purge:
    description: Allows database purge maintenance commands.
    default: op
  protectcore.admin.status:
    description: Allows viewing database and service health.
    default: op
  protectcore.hidden.tp:
    description: Allows hidden teleport commands generated by ProtectCore.
    default: op
